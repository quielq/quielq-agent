[project]
name = "quielq-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quielq", email = "quielquiwa@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
quielq-agent = "quielq_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
